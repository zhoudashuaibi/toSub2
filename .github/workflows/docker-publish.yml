name: Docker Publish

# 推送到 main 或打 v* 标签时，构建多架构镜像并发布到 GHCR（ghcr.io）
# 服务器上更新：docker compose pull && docker compose up -d
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# 同一时间只保留最新一次构建，取消排队中的旧任务
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # arm64 靠 QEMU 模拟构建（本项目 Node + Python，构建压力不大）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名统一小写（GHCR 要求，toSub2 → tosub2）
      # 标签规则：
      #   push main → latest + main + sha-xxxxxxx
      #   push v1.5.4 → 1.5.4 + 1.5 + sha-xxxxxxx
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=toSub2
            org.opencontainers.image.description=通过协议登录 ChatGPT、完成 Codex 授权并生成 sub2api 导入文件

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭 provenance，避免老版本 Docker/Compose 拉取时遇到 unknown/unknown 架构清单
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
